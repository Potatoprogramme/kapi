# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  products:
    create:
      success: "Product was successfully created."
      failure: "Could not create product."
    update:
      success: "Product was successfully updated."
      failure: "Could not update product."
    soft_delete:
      success: "Product was successfully deleted."
      failure: "Failed to delete product."
  materials:
    create:
      success: "Material was successfully created."
      failure: "Could not create material."
    update:
      success: "Material was successfully updated"
      failure: "Could not update material."
    destroy:
      success: "Material was successfully deleted."
      failure: "Could not delete material."
      exists: "This material is being used."
  product_categories:
    create:
      success: "Category successfully created."
      failure: "Could not create category."
    destroy:
      success: "Category successfully deleted."
      failure: "Failed to delete category."
  orders:
    create:
      success: "Order created successfully."
      failure: "Failed to create order."
    complete_order:
      success: "Updated successfully"
